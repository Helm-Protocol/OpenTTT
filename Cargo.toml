[package]
name = "openttt"
version = "0.2.12"
edition = "2021"
description = "OpenTTT — TLS TimeToken SDK with Roughtime chain for PoT Issuer"
license = "BSL-1.1"
repository = "https://github.com/Helm-Protocol/OpenTTT"

[[bin]]
name = "openttt-issuer"
path = "src/roughtime/main_stub.rs"

[lib]
name = "openttt"
path = "src/roughtime/lib.rs"

[dependencies]
tokio       = { version = "1",  features = ["full"] }
sha2        = "0.10"
rand        = "0.8"
hex         = "0.4"
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"

[dev-dependencies]
tokio-test  = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
